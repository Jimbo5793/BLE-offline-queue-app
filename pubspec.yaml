name: beaconq
description: "BeaconQ: offline BLE attendance and session queues."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  audioplayers: ^6.8.1
  flutter_blue_plus: ^2.3.13
  ble_peripheral_plus: ^2.5.4
  permission_handler: ^11.3.1
  uuid: ^4.5.3
  sqflite: ^2.4.4
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
